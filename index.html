<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Repeat · 단어 오답노트</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
@font-face{font-family:'Jalnan2';src:url('fonts/Jalnan2TTF.ttf') format('truetype'),url('fonts/Jalnan2.otf') format('opentype');font-weight:400;font-display:swap}
:root{
  --bg:#0E1A16; --bg-2:#101E19; --surface:#152520; --raised:#182A23;
  --line:#1F2F28; --line-soft:#1A2721; --line-strong:#2A3E34;
  --ink:#E7EEE7; --ink-2:#A9B8AE; --muted:#7C9088; --faint:#5E7368;
  --mint:#4FD9B4; --mint-soft:#1C3B32; --mint-ink:#8FEFD2; --on-mint:#0B1512;
  --danger:#E8827A; --danger-soft:#3E2320;
  --heat-0-bg:#233129; --heat-0:#8FA096;
  --heat-1-bg:#4A4222; --heat-1:#E9D48F;
  --heat-2-bg:#5B4020; --heat-2:#EAB57E;
  --heat-3-bg:#603120; --heat-3:#EE9C7C;
  --heat-4-bg:#5C231F; --heat-4:#FBD3CD;
  --pos-noun-bg:#332D4C; --pos-noun:#CBBEEC;
  --pos-verb-bg:#1C3B32; --pos-verb:#9EEBD3;
  --pos-adj-bg:#3D2F16; --pos-adj:#EFC98A;
  --pos-adv-bg:#20334A; --pos-adv:#A9C7E4;
  --pos-etc-bg:#293530; --pos-etc:#93A69C;
  --f-ui:'IBM Plex Sans KR',system-ui,sans-serif;
  --f-en:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --f-logo:'Baloo 2',cursive;
  --f-kr:'Jalnan2','IBM Plex Sans KR',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --hover:#17271F; --dot-off:#243329; --rule:#243329; --rule-dot:#2F433A; --rule-dot-2:#3C5449;
  --chip-bg:#1B2B25; --scrim:rgba(8,16,13,.62); --mark-ink:#B9F3E1;
  --shadow-1:0 12px 32px rgba(0,0,0,.35); --shadow-2:0 16px 40px rgba(0,0,0,.5);
}
:root[data-theme="302"]{
  --bg:#F4F1EA; --bg-2:#FFFFFF; --surface:#FFFFFF; --raised:#FFFFFF;
  --line:#E3DFD3; --line-soft:#EDEAE1; --line-strong:#D2CCBB;
  --ink:#1C3A46; --ink-2:#44606C; --muted:#6F8894; --faint:#9AAAB2;
  --mint:#F3CE72; --mint-soft:#FBF0D5; --mint-ink:#6A4E08; --on-mint:#3A2A06;
  --danger:#C25B4E; --danger-soft:#F8E4DF;
  --heat-0-bg:#ECEFE9; --heat-0:#63757D;
  --heat-1-bg:#FBF0CE; --heat-1:#7A5E12;
  --heat-2-bg:#F7E3C0; --heat-2:#6B4211;
  --heat-3-bg:#F6D6C4; --heat-3:#8A3E17;
  --heat-4-bg:#F3CFC9; --heat-4:#8E2F26;
  --pos-noun-bg:#E6E1F2; --pos-noun:#4B3A78;
  --pos-verb-bg:#D9EFEA; --pos-verb:#0E5B52;
  --pos-adj-bg:#FAEFD2; --pos-adj:#6B4211;
  --pos-adv-bg:#D9E9F2; --pos-adv:#15586F;
  --pos-etc-bg:#ECEBE4; --pos-etc:#5A6A70;
  --hover:#FAF8F3; --dot-off:#E3DFD3; --rule:#EDEAE1; --rule-dot:#D2CCBB; --rule-dot-2:#A8B6BC;
  --chip-bg:#F1EEE6; --scrim:rgba(28,58,70,.32); --mark-ink:#0E6E8C;
  --shadow-1:0 8px 22px rgba(28,58,70,.1); --shadow-2:0 14px 34px rgba(28,58,70,.14);
}
:root[data-theme="287"]{
  --bg:#F3F7F8; --bg-2:#FFFFFF; --surface:#FFFFFF; --raised:#FFFFFF;
  --line:#DFE8EA; --line-soft:#E9F0F1; --line-strong:#C9D9DC;
  --ink:#1B333D; --ink-2:#456068; --muted:#6F8992; --faint:#9DB0B6;
  --mint:#CF4E74; --mint-soft:#FCE4EC; --mint-ink:#9C2C50; --on-mint:#FFFFFF;
  --danger:#B84A31; --danger-soft:#FAE5DC;
  --heat-0-bg:#E9F0F1; --heat-0:#5C7780;
  --heat-1-bg:#FCEFC9; --heat-1:#7A5E12;
  --heat-2-bg:#FBE2C4; --heat-2:#6B4211;
  --heat-3-bg:#FAD4C8; --heat-3:#8A3E17;
  --heat-4-bg:#FBD3DF; --heat-4:#98274F;
  --pos-noun-bg:#E9E2F5; --pos-noun:#4B3A78;
  --pos-verb-bg:#D6EFEC; --pos-verb:#0B5B56;
  --pos-adj-bg:#FBEFD2; --pos-adj:#6B4211;
  --pos-adv-bg:#DCEBF7; --pos-adv:#20526B;
  --pos-etc-bg:#EAF0F1; --pos-etc:#51686F;
  --hover:#F7FBFB; --dot-off:#DEE8EA; --rule:#E9F0F1; --rule-dot:#C9D9DC; --rule-dot-2:#9FB6BD;
  --chip-bg:#EEF4F5; --scrim:rgba(27,51,61,.32); --mark-ink:#9C2C50;
  --shadow-1:0 8px 22px rgba(27,51,61,.1); --shadow-2:0 14px 34px rgba(27,51,61,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;position:fixed;inset:0;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
*{touch-action:manipulation}
input,select,textarea{font-size:16px !important}
.vw-top{display:flex;align-items:center;gap:10px}
.back.vw{transition:background-color .28s ease}
.back.vw.enter{animation:vwFade .28s ease both}
.sheet.vw-sheet{height:67vh;height:67dvh;max-height:none;overscroll-behavior:contain;will-change:transform}
.sheet.vw-sheet.enter{animation:vwUp .34s cubic-bezier(.22,.9,.3,1) both}
@keyframes vwUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes vwFade{from{background-color:transparent}}
@media (min-width:640px){.sheet.vw-sheet{height:auto;max-height:86vh}}
.vw-spk{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:var(--mint-soft);color:var(--mint);display:flex;align-items:center;justify-content:center;cursor:pointer}
.vw-meta{font-size:12px;color:var(--muted);margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.vw-meta b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.vw-acts{display:flex;gap:8px;margin-top:20px;align-items:center}
.vw-acts .pbtn{margin:0;flex:1}
.vw-acts .delbtn{padding:15px 18px;border-radius:13px}
.vw-acts .confirm{flex:1}
a{color:var(--mint);text-decoration:none}a:hover{color:var(--mint-ink)}
::selection{background:var(--mint-soft)}
.app{max-width:520px;margin:0 auto;padding:0 0 84px;height:100%;display:flex;flex-direction:column;overflow:hidden}
#view{flex:1;min-height:0;overflow:hidden;touch-action:none}
#view.scrolly{overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain}
.wrap{padding:0 16px}
.err{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#2A0F0C;padding:10px 16px;font-size:13px;text-align:center;z-index:200;display:none;font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;position:relative}
#menuRoot{position:absolute;top:44px;right:0;left:0;height:0}
.top-r{margin-left:auto}
.logo-sub{display:none}
.logo{font-family:var(--f-logo);font-weight:800;font-size:19px;line-height:1;letter-spacing:-.005em}
.logo span{color:var(--mint)}
.logo-sub{font-size:11.5px;color:var(--muted)}
.brand{display:flex;align-items:baseline;gap:8px}
.top-r{display:flex;align-items:center;gap:14px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--mint);display:block}
.sync.loading i{background:var(--danger)}
.more{background:none;border:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:2px 4px}
.more:hover{color:var(--ink)}
.menu{position:absolute;top:4px;right:14px;width:238px;background:var(--raised);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-2);overflow:hidden;z-index:60}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;border-top:1px solid var(--line);color:var(--ink);font-size:13.5px;padding:13px 15px;cursor:pointer;text-align:left}
.menu button:first-child{border-top:none}
.menu button:hover{background:var(--surface)}
.menu .who{padding:12px 15px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.menu .out{color:var(--danger)}

/* stat line */
.statline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:2px 18px 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.statline b{color:var(--ink);font-weight:600}
.statline .w{color:var(--danger);font-weight:600}
.statline .g{color:var(--mint);font-weight:600}
.statline .dot{color:#3A4E44}

/* home card */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.setup-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.setup-title{font-family:var(--f-kr);font-size:19px;letter-spacing:.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;border-top:1px solid var(--line-soft);padding:12px 16px;color:var(--ink);cursor:pointer;text-align:left}
.row:hover{background:var(--hover)}
.row-k{font-size:12.5px;color:var(--muted)}
.row-v{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.row-v small{color:var(--muted);font-weight:400;font-size:12px}
.row-v i{color:var(--faint);font-style:normal}
.row.static{cursor:default}
.row.static:hover{background:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:none;background:var(--chip-bg);color:var(--ink-2);font-size:13px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:var(--f-mono)}
.chip.kr{font-family:var(--f-ui)}
.chip.on{background:var(--mint);color:var(--on-mint);font-weight:700}
.start-wrap{padding:14px 16px 16px;border-top:1px solid var(--line-soft)}
.start{width:100%;background:var(--mint);color:var(--on-mint);border:none;border-radius:11px;padding:11px 14px 13px;cursor:pointer;display:block}
.start .n{font-family:var(--f-mono);font-size:11px;font-weight:600;opacity:.62}
.start .t{font-size:15.5px;font-weight:700;margin-top:1px}
.start:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--faint);line-height:1.6;padding:12px 2px 0;text-align:center}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg-2);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:11px 0 13px;cursor:pointer;font-family:inherit}
.tabbar button .ic{font-size:16px;line-height:1.2}
.tabbar button .lb{font-size:11px;margin-top:3px}
.tabbar button.on{color:var(--mint)}
.tabbar button.on .lb{font-weight:600}

/* session */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.quit{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0}
.dots{flex:1;min-width:0;height:5px;border-radius:99px;background:var(--dot-off);overflow:hidden}
.dots i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .42s cubic-bezier(.35,.8,.3,1)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stage{position:relative;height:440px;margin:0 16px 8px;touch-action:none}
.swipe{position:absolute;left:16px;right:16px;top:28px;bottom:24px;will-change:transform}
.flip{position:absolute;inset:0;transition:transform .17s ease-in}
.flip.half{transform:perspective(1100px) rotateY(90deg)}
.flip.pre{transform:perspective(1100px) rotateY(-90deg)}
.flip.inAnim{transition:transform .19s ease-out}
.ghost{position:absolute;left:16px;right:16px;top:28px;bottom:24px;transform:scale(.945) translateY(-15px);pointer-events:none}
.ghost>.card{filter:brightness(.42) saturate(.7) blur(3px)}
.ghost.far{display:none}
.swipe.enter{animation:cardIn .4s cubic-bezier(.32,.86,.4,1)}
@keyframes cardIn{from{transform:scale(.945) translateY(-15px);filter:brightness(.42) saturate(.7) blur(3px)}to{transform:none;filter:none}}
.lay{position:absolute;border-radius:22px}
.lay.a{left:40px;right:40px;top:0;bottom:8px;background:var(--surface);border:1px solid var(--line-soft);opacity:.75}
.lay{display:none}
.card{position:absolute;inset:0;background:var(--raised);border:1px solid var(--line-strong);border-radius:22px;box-shadow:var(--shadow-1);padding:28px 22px;cursor:pointer;overflow:hidden;touch-action:none}
.card.scrolly{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.card.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;background:var(--mint-soft);font-size:11.5px;font-weight:600;color:#9FB3A8}
.tag.h1{background:var(--heat-1-bg);color:var(--heat-1)}
.tag.h2{background:var(--heat-2-bg);color:var(--heat-2)}
.tag.h3{background:var(--heat-3-bg);color:var(--heat-3)}
.tag.h4{background:var(--heat-4-bg);color:var(--heat-4)}
.tag.h0{background:var(--heat-0-bg);color:var(--heat-0)}
.q-en{font-family:var(--f-en);font-weight:700;font-size:40px;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.q-ko{font-family:var(--f-ui);font-weight:700;font-size:30px;line-height:1.3;word-break:keep-all}
.hints{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{border:none;background:var(--mint-soft);color:#BCCDC2;border-radius:999px;padding:8px 14px;font-size:12.5px;cursor:pointer}
.hint:hover{color:var(--ink)}
.hint-box{background:var(--surface);border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.6;text-align:left;width:100%;color:var(--ink-2)}
.hint-box .hl{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.hint-box .blank{color:var(--faint)}
.hint-box mark{background:var(--mint-soft);color:var(--mark-ink);padding:0 3px;border-radius:4px;font-weight:600}
.reveal{font-size:12px;color:var(--faint)}
.a-en{font-family:var(--f-en);font-size:28px;font-weight:700;letter-spacing:-.02em;border-bottom:1px dotted var(--rule-dot-2);display:inline-block;padding-bottom:1px;cursor:pointer}
.a-ko{font-size:20px;font-weight:700;margin-top:6px}
.a-chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pos{padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pos-noun{background:var(--pos-noun-bg);color:var(--pos-noun)}
.pos-verb{background:var(--pos-verb-bg);color:var(--pos-verb)}
.pos-adj{background:var(--pos-adj-bg);color:var(--pos-adj)}
.pos-adv{background:var(--pos-adv-bg);color:var(--pos-adv)}
.pos-etc{background:var(--pos-etc-bg);color:var(--pos-etc)}
.hr{height:1px;background:var(--rule);margin:16px 0}
.ex{font-size:14px;line-height:1.75;color:var(--ink);border-bottom:1px dotted var(--rule-dot);padding-bottom:6px;cursor:pointer}
.ex+.ex{margin-top:8px}
.ex mark{background:var(--mint-soft);color:var(--mark-ink);padding:0 3px;border-radius:4px;font-weight:600}
.sa{display:flex;align-items:flex-start;gap:8px;margin-top:13px}
.sa b{flex:none;width:19px;height:19px;border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sa.syn b{background:var(--mint-soft);color:var(--mint-ink)}
.sa.ant b{background:var(--danger-soft);color:var(--danger)}
.sa span{font-size:13px;color:#BCCDC2;line-height:1.5}
.tip{font-size:11px;color:var(--faint);margin-top:14px}
.stamp{position:absolute;top:18px;right:18px;padding:5px 10px;border:1.5px solid var(--mint);color:var(--mint);border-radius:7px;font-size:12px;font-weight:700;letter-spacing:.04em;opacity:0;transition:opacity .12s}
.stamp.no{border-color:var(--danger);color:var(--danger);left:18px;right:auto}
.grade{display:flex;align-items:center;justify-content:space-between;padding:0 24px 18px}
.gbtn{width:46px;height:46px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer}
.gbtn.no{background:var(--danger-soft);color:var(--danger)}
.gbtn.ok{background:var(--mint);color:var(--on-mint)}
.ghint{font-size:11.5px;color:var(--faint);text-align:center}

/* summary */
.sum{padding:30px 20px 24px}
.sum-big{display:flex;align-items:flex-end;gap:12px}
.sum-big .n{font-family:var(--f-logo);font-size:68px;font-weight:800;line-height:.85;color:var(--mint)}
.sum-big .d{font-family:var(--f-logo);font-size:30px;font-weight:700;line-height:1;color:var(--faint)}
.sum-t{font-size:15px;font-weight:600;margin-top:14px}
.sum-s{font-size:13px;color:var(--muted);margin-top:4px}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:18px}
.miss .hl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.miss-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line-soft)}
.miss-row:first-of-type{border-top:none}
.miss-row b{font-family:var(--f-en);font-weight:700}
.miss-row span{color:var(--ink-2)}
.pbtn{width:100%;background:var(--mint);color:var(--on-mint);border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
.sbtn{width:100%;background:none;border:1px solid var(--line-strong);color:var(--ink-2);border-radius:13px;padding:13px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:9px}

/* bank */
.bank-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.bank-title{font-family:var(--f-kr);font-size:22px;letter-spacing:.01em}
.bank-h .acts{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:0}
.linkbtn:hover{color:var(--ink)}
.addbtn{background:var(--mint);color:var(--on-mint);border:none;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.lists{display:flex;gap:7px;padding:4px 18px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.lists::-webkit-scrollbar{height:4px}
.lchip{flex:none;border:none;background:none;color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit}
.lchip.on{background:var(--mint-soft);color:var(--ink);font-weight:700}
.lchip .c{font-family:var(--f-mono);opacity:.6}
.search-row{display:flex;gap:8px;padding:0 18px 12px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:16px;color:var(--ink)}
.search::placeholder{color:var(--faint)}
.search:focus,.sel:focus,input:focus,textarea:focus{outline:2px solid var(--mint);outline-offset:1px}

<script>
(function(){
"use strict";

function showError(msg){
  var el = document.getElementById('errorBanner');
  if(!el) return;
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';

}

/* ---------------- color theme ---------------- */
var THEMES = [
  {v:'mint', label:'딥그린 · 민트', sub:'기본 테마', sw:['#0E1A16','#182A23','#4FD9B4','#E7EEE7']},
  {v:'302',  label:'파스텔 버터 · 티얼', sub:'따뜻한 크림 바탕 (302)', sw:['#F4F1EA','#C9BE9C','#0E6E8C','#F3CE72']},
  {v:'287',  label:'파스텔 아쿠아 · 핑크', sub:'밝은 바탕에 핑크 포인트 (287)', sw:['#F3F7F8','#B7E0EA','#8FD3D3','#CF4E74']}
];
function currentTheme(){ try{ return localStorage.getItem('repeat_theme') || 'mint'; }catch(e){ return 'mint'; } }
function applyTheme(v){
  try{ localStorage.setItem('repeat_theme', v); }catch(e){}
  document.documentElement.setAttribute('data-theme', v);
}
applyTheme(currentTheme());

/* ---------------- supabase client ---------------- */
var CFG = window.APP_CONFIG || {};
var configOk = CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY
  && CFG.SUPABASE_URL.indexOf('여기에') === -1
  && CFG.SUPABASE_ANON_KEY.indexOf('여기에') === -1;
var sb = null;

function keepSignedIn(){ try{ return localStorage.getItem('repeat_keep') !== '0'; }catch(e){ return true; } }
function setKeepSignedIn(v){ try{ localStorage.setItem('repeat_keep', v ? '1' : '0'); }catch(e){} }
function buildClient(){
  if(!configOk || !window.supabase) return null;
  return window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: keepSignedIn() ? window.localStorage : window.sessionStorage
    }
  });
}
sb = buildClient();

var POS = [
  {v:'명사', cls:'pos-noun'}, {v:'동사', cls:'pos-verb'}, {v:'형용사', cls:'pos-adj'},
  {v:'부사', cls:'pos-adv'}, {v:'기타', cls:'pos-etc'}
];
function posCls(p){ var f = POS.filter(function(x){return x.v===p;})[0]; return f?f.cls:'pos-etc'; }

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ---------------- 동의어 / 반의어 분리 ---------------- */
var ANT_SPLIT = /\s*(?:↔|⇄|<->|\/\s*반의어?\s*[:：]?|반의어\s*[:：]|반의\s*[:：]|반대\s*[:：]|\bopp(?:osite)?s?\s*[.:]|\bant(?:onym)?s?\s*[.:])\s*/i;
function splitSynAnt(raw){
  var s = String(raw||'');
  var m = s.split(ANT_SPLIT);
  if(m.length > 1) return { syn: m[0].trim(), ant: m.slice(1).join(' ').trim() };
  return { syn: s.trim(), ant: '' };
}
function joinSynAnt(syn, ant){
  syn = (syn||'').trim(); ant = (ant||'').trim();
  if(syn && ant) return syn + ' ↔ ' + ant;
  return ant ? '↔ ' + ant : syn;
}

/* ---------------- text-to-speech ---------------- */
var ttsVoices = [];
function refreshVoices(){
  if('speechSynthesis' in window) ttsVoices = window.speechSynthesis.getVoices() || [];
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = function(){ refreshVoices(); if(state.voiceModal) render(); };
}
function savedVoiceURI(){ try{ return localStorage.getItem('oapnote_voice_uri') || ''; }catch(e){ return ''; } }
function saveVoiceURI(uri){ try{ localStorage.setItem('oapnote_voice_uri', uri); }catch(e){} }
function pickVoice(){
  var saved = savedVoiceURI();
  if(saved){
    var match = ttsVoices.find(function(v){ return v.voiceURI===saved; });
    if(match) return match;
  }
  var en = ttsVoices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('en')===0; });
  if(!en.length) return null;
  var rank = function(v){
    if(/natural/i.test(v.name)) return 0;
    if(/online|neural/i.test(v.name)) return 1;
    if(/google/i.test(v.name)) return 2;
    if(/samantha|alex|aria|jenny|zira/i.test(v.name)) return 3;
    if(v.lang.toLowerCase()==='en-us') return 4;
    return 5;
  };
  en.sort(function(a,b){ return rank(a)-rank(b); });
  return en[0];
}
function speak(text, voiceOverride){
  if(!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  var voice = voiceOverride || pickVoice();
  if(voice){ utter.voice = voice; utter.lang = voice.lang; } else { utter.lang = 'en-US'; }
  utter.rate = 0.93;
  window.speechSynthesis.speak(utter);
}
function bindSpeakables(root){
  root.querySelectorAll('[data-speak]').forEach(function(el){
    el.onclick = function(e){ e.stopPropagation(); speak(el.dataset.speak||''); };
  });
}

function heatLevel(n){
  n = n||0;
  if(n<=0) return 0;
  if(n<=2) return 1;
  if(n<=4) return 2;
  if(n<=7) return 3;
  return 4;
}

/* ---- inflection-aware word highlighting ---- */
var IRREGULAR = {
  be:['was','were','been','being','am','is','are'], have:['has','had','having'], do:['does','did','done','doing'],
  go:['goes','went','gone'], get:['got','gotten'], make:['made'], take:['took','taken'], give:['gave','given'],
  see:['saw','seen'], come:['came'], know:['knew','known'], think:['thought'], find:['found'], tell:['told'],
  leave:['left'], feel:['felt'], bring:['brought'], begin:['began','begun'], keep:['kept'], hold:['held'],
  write:['wrote','written'], stand:['stood'], hear:['heard'], mean:['meant'], meet:['met'], run:['ran'],
  pay:['paid'], sit:['sat'], speak:['spoke','spoken'], lead:['led'], grow:['grew','grown'], lose:['lost'],
  fall:['fell','fallen'], send:['sent'], build:['built'], draw:['drew','drawn'], break:['broke','broken'],
  spend:['spent'], rise:['rose','risen'], drive:['drove','driven'], buy:['bought'], wear:['wore','worn'],
  choose:['chose','chosen'], seek:['sought'], throw:['threw','thrown'], catch:['caught'], deal:['dealt'],
  win:['won'], forget:['forgot','forgotten'], lay:['laid'], hide:['hid','hidden'], bear:['bore','borne','born'],
  bind:['bound'], beat:['beaten'], bend:['bent'], bite:['bit','bitten'], blow:['blew','blown'], burn:['burnt'],
  cling:['clung'], creep:['crept'], dig:['dug'], drink:['drank','drunk'], eat:['ate','eaten'], feed:['fed'],
  fight:['fought'], flee:['fled'], fly:['flew','flown'], forbid:['forbade','forbidden'], forgive:['forgave','forgiven'],
  freeze:['froze','frozen'], hang:['hung'], lend:['lent'], light:['lit'], ride:['rode','ridden'], ring:['rang','rung'],
  shake:['shook','shaken'], shine:['shone'], shoot:['shot'], shrink:['shrank','shrunk'], sing:['sang','sung'],
  sink:['sank','sunk'], slide:['slid'], steal:['stole','stolen'], stick:['stuck'], sting:['stung'], strike:['struck'],
  swear:['swore','sworn'], sweep:['swept'], swim:['swam','swum'], swing:['swung'], tear:['tore','torn'],
  wake:['woke','woken'], weep:['wept'], wind:['wound'], say:['said'], sell:['sold'], teach:['taught'],
  overcome:['overcame'], undergo:['underwent','undergone'], withdraw:['withdrew','withdrawn'], understand:['understood']
};
function wordVariants(w){
  var f = [w];
  if(/(s|x|z|ch|sh)$/.test(w)) f.push(w+'es');
  else if(/[^aeiou]y$/.test(w)) f.push(w.slice(0,-1)+'ies');
  else f.push(w+'s');
  if(/[^aeiou]y$/.test(w)){ f.push(w.slice(0,-1)+'ied', w+'ing'); }
  else if(/ie$/.test(w)){ f.push(w+'d', w.slice(0,-2)+'ying'); }
  else if(/e$/.test(w)){ f.push(w+'d', w.slice(0,-1)+'ing', w+'ing'); }
  else { f.push(w+'ed', w+'ing'); }
  if(/[^aeiou][aeiou][bdfgklmnprstvz]$/.test(w)){ var l = w.slice(-1); f.push(w+l+'ed', w+l+'ing'); }
  Object.keys(IRREGULAR).forEach(function(k){
    if(w===k || (w.length>k.length && w.slice(-k.length)===k)){
      var prefix = w.slice(0, w.length-k.length);
      IRREGULAR[k].forEach(function(form){ f.push(prefix+form); });
      if(w!==k) f.push(w);
    }
  });
  var seen = {};
  return f.filter(function(x){ if(seen[x]) return false; seen[x]=1; return true; })
    .sort(function(a,b){ return b.length-a.length; });
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function buildWordRegexes(word){
  var tokens = String(word||'').trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return [];
  function make(firstTok, restToks){
    var alt = wordVariants(firstTok.toLowerCase()).map(escapeRe).join('|');
    var body = '(?:'+alt+')' + restToks.map(function(t){ return '\\s+'+escapeRe(t); }).join('');
    return new RegExp('(^|[^A-Za-z])('+body+')(?![A-Za-z])', 'gi');
  }
  var list = [make(tokens[0], tokens.slice(1))];
  if(tokens.length>1){
    var longest = tokens.slice().sort(function(a,b){ return b.length-a.length; })[0];
    list.push(make(longest, []));
  }
  return list;
}
function markWordInText(text, word, mask){
  text = String(text||'');
  var regs = buildWordRegexes(word);
  for(var r=0;r<regs.length;r++){
    var re = regs[r];
    re.lastIndex = 0;
    var out = '', last = 0, m, found = false;
    while((m = re.exec(text))){
      found = true;
      var start = m.index + m[1].length;
      out += escapeHtml(text.slice(last, start));
      out += mask ? '<span class="blank">▢▢▢▢▢</span>' : '<mark>'+escapeHtml(m[2])+'</mark>';
      last = start + m[2].length;
      if(m[0].length===0) re.lastIndex++;
    }
    if(found) return out + escapeHtml(text.slice(last));
  }
  return escapeHtml(text);
}
function formatExample(example, word, mask){
  if(!example) return '';
  return String(example).split(/\s*\/\s*/).filter(Boolean).map(function(p){
    return '<div>' + markWordInText(p, word, mask) + '</div>';
  }).join('');
}
function answerExampleHtml(example, word){
  if(!example) return '';
  return String(example).split(/\s*\/\s*/).filter(Boolean).map(function(p){
    return '<div class="ex" data-speak="'+escapeHtml(p)+'">'+markWordInText(p, word, false)+'</div>';
  }).join('');
}

/* ---------------- csv ---------------- */
function parseCsv(text){
  text = String(text||'').replace(/^\ufeff/, '');
  var rows = [], row = [], field = '', inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}
var CSV_HEADER_MAP = {
  word: ['단어','word','영단어','영어단어'],
  pos: ['품사','pos'],
  meaning: ['한글뜻','한글 뜻','뜻','meaning','의미'],
  example: ['예문','example','예시'],
  synAnt: ['동의어','동의어반의어','동의어·반의어','동의어/반의어','동반','동/반','synonym','synant','synonyms'],
  list: ['단어장','목록','list']
};
var POS_ALIASES = { noun:'명사', verb:'동사', adjective:'형용사', adverb:'부사', etc:'기타', other:'기타' };
function normalizePos(v){
  v = String(v||'').trim();
  if(!v) return '기타';
  var alias = POS_ALIASES[v.toLowerCase()];
  if(alias) return alias;
  var known = POS.filter(function(p){ return p.v===v; })[0];
  return known ? known.v : v;
}
function csvRowsToWords(rows){
  if(!rows.length) return { items: [], skipped: 0, hasListCol: false };
  var header = rows[0].map(function(c){ return String(c).trim().toLowerCase(); });
  var colIdx = { word:-1, pos:-1, meaning:-1, example:-1, synAnt:-1, list:-1 };
  Object.keys(CSV_HEADER_MAP).forEach(function(key){
    var aliases = CSV_HEADER_MAP[key];
    for(var i=0;i<header.length;i++){
      if(aliases.indexOf(header[i]) > -1){ colIdx[key] = i; break; }
    }
  });
  var hasHeader = colIdx.word > -1 || colIdx.meaning > -1;
  var dataRows = hasHeader ? rows.slice(1) : rows;
  if(!hasHeader){ colIdx = { word:0, pos:1, meaning:2, example:3, synAnt:4, list:-1 }; }
  var items = [], skipped = 0;
  dataRows.forEach(function(r){
    var word = colIdx.word>-1 ? (r[colIdx.word]||'').trim() : '';
    var meaning = colIdx.meaning>-1 ? (r[colIdx.meaning]||'').trim() : '';
    if(!word || !meaning){ skipped++; return; }
    items.push({
      word: word,
      pos: normalizePos(colIdx.pos>-1 ? r[colIdx.pos] : ''),
      meaning: meaning,
      example: colIdx.example>-1 ? (r[colIdx.example]||'').trim() : '',
      synAnt: colIdx.synAnt>-1 ? (r[colIdx.synAnt]||'').trim() : '',
      listName: colIdx.list>-1 ? (r[colIdx.list]||'').trim() : ''
    });
  });
  return { items: items, skipped: skipped, hasListCol: colIdx.list>-1 };
}
function csvEscape(v){
  v = String(v==null ? '' : v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function buildCsvText(words, includeListCol){
  var header = ['단어','품사','한글뜻','예문','동의어반의어'];
  if(includeListCol) header.push('단어장');
  var lines = [header.join(',')];
  words.forEach(function(w){
    var row = [w.word, w.pos||'', w.meaning, w.example||'', w.synAnt||''];
    if(includeListCol) row.push(listName(w.listId));
    lines.push(row.map(csvEscape).join(','));
  });
  return lines.join('\n');
}

/* ---------------- store ---------------- */
function rowToWord(r){
  return {
    id: r.id, listId: r.list_id, word: r.word, pos: r.pos, meaning: r.meaning,
    example: r.example || '', synAnt: r.syn_ant || '',
    wrongCount: r.wrong_count||0, correctCount: r.correct_count||0,
    createdAt: r.created_at ? new Date(r.created_at).getTime() : 0
  };
}
function wordToRow(data, userId){
  var row = {};
  if(data.word!==undefined) row.word = data.word;
  if(data.pos!==undefined) row.pos = data.pos;
  if(data.meaning!==undefined) row.meaning = data.meaning;
  if(data.example!==undefined) row.example = data.example;
  if(data.synAnt!==undefined) row.syn_ant = data.synAnt;
  if(data.listId!==undefined) row.list_id = data.listId;
  if(data.wrongCount!==undefined) row.wrong_count = data.wrongCount;
  if(data.correctCount!==undefined) row.correct_count = data.correctCount;
  if(userId) row.user_id = userId;
  return row;
}
function rowToList(r){ return { id:r.id, name:r.name, createdAt: r.created_at ? new Date(r.created_at).getTime() : 0 }; }

var Store = {
  words: [], lists: [], listeners: [], userId: null, ready: false, wordsChannel: null, listsChannel: null,
  onChange: function(cb){ this.listeners.push(cb); },
  emit: function(){ this.listeners.forEach(function(fn){ fn(); }); },
  initForUser: async function(userId){
    this.userId = userId; this.ready = false; this.emit();
    var listsRes = await sb.from('lists').select('*').eq('user_id', userId).order('created_at');
    var wordsRes = await sb.from('words').select('*').eq('user_id', userId);
    if(listsRes.error) showError(listsRes.error.message);
    if(wordsRes.error) showError(wordsRes.error.message);
    this.lists = (listsRes.data||[]).map(rowToList);
    this.words = (wordsRes.data||[]).map(rowToWord);
    this.ready = true;
    this.subscribeRealtime();
    this.emit();
  },
  subscribeRealtime: function(){
    var self = this;
    this.listsChannel = sb.channel('lists-'+this.userId)
      .on('postgres_changes', {event:'*', schema:'public', table:'lists', filter:'user_id=eq.'+this.userId}, function(payload){
        self.applyListChange(payload); self.emit();
      }).subscribe();
    this.wordsChannel = sb.channel('words-'+this.userId)
      .on('postgres_changes', {event:'*', schema:'public', table:'words', filter:'user_id=eq.'+this.userId}, function(payload){
        self.applyWordChange(payload); self.emit();
      }).subscribe();
  },
  applyListChange: function(payload){
    if(payload.eventType==='INSERT'){
      if(!this.lists.some(function(l){return l.id===payload.new.id;})) this.lists.push(rowToList(payload.new));
    } else if(payload.eventType==='UPDATE'){
      var l = this.lists.find(function(x){return x.id===payload.new.id;});
      if(l) Object.assign(l, rowToList(payload.new));
    } else if(payload.eventType==='DELETE'){
      this.lists = this.lists.filter(function(x){return x.id!==payload.old.id;});
    }
  },
  applyWordChange: function(payload){
    if(payload.eventType==='INSERT'){
      if(!this.words.some(function(w){return w.id===payload.new.id;})) this.words.push(rowToWord(payload.new));
    } else if(payload.eventType==='UPDATE'){
      var w = this.words.find(function(x){return x.id===payload.new.id;});
      if(w) Object.assign(w, rowToWord(payload.new));
    } else if(payload.eventType==='DELETE'){
      this.words = this.words.filter(function(x){return x.id!==payload.old.id;});
    }
  },
  teardown: function(){
    if(this.wordsChannel){ sb.removeChannel(this.wordsChannel); this.wordsChannel=null; }
    if(this.listsChannel){ sb.removeChannel(this.listsChannel); this.listsChannel=null; }
    this.words = []; this.lists = []; this.userId = null; this.ready = false;
  },
  add: function(data){ this.addAsync(data); },
  addAsync: async function(data){
    var res = await sb.from('words').insert(wordToRow(data, this.userId));
    if(res.error) showError(res.error.message);
    return {};
  },
  update: function(id, patch){ this.updateAsync(id, patch); },
  updateAsync: async function(id, patch){
    var res = await sb.from('words').update(wordToRow(patch, null)).eq('id', id);
    if(res.error) showError(res.error.message);
  },
  remove: async function(id){
    var res = await sb.from('words').delete().eq('id', id);
    if(res.error) showError(res.error.message);
  },
  addListAsync: async function(name){
    var res = await sb.from('lists').insert({ name: name, user_id: this.userId }).select().single();
    if(res.error){ showError(res.error.message); throw res.error; }
    return rowToList(res.data);
  },
  renameList: async function(id, name){
    var res = await sb.from('lists').update({name:name}).eq('id', id);
    if(res.error) showError(res.error.message);
  },
  deleteList: async function(id, cascade){
    var wordsIn = this.words.filter(function(w){ return w.listId===id; });
    if(wordsIn.length && !cascade) return false;
    var res = await sb.from('lists').delete().eq('id', id);
    if(res.error){ showError(res.error.message); return false; }
    return true;
  }
};

      + '<button class="pbtn" id="goBankBtn">단어장으로 이동</button></div>';

  }

  if(state.setup.listId && !Store.lists.some(function(l){return l.id===state.setup.listId;})) state.setup.listId = null;

  var scoped = wordsInList(state.setup.listId);

  scoped.forEach(function(w){ var n = w.wrongCount||0; wrongNCounts[n] = (wrongNCounts[n]||0)+1; });
  var wrongNValues = Object.keys(wrongNCounts).map(Number).sort(function(a,b){ return a-b; });
  if(state.setup.scope==='wrongN' && wrongNValues.indexOf(state.setup.wrongN)===-1){
    state.setup.wrongN = wrongNValues.length ? wrongNValues[wrongNValues.length-1] : null;
  }
  var pool = scopeFilteredWords(state.setup.listId, state.setup.scope);
  if(state.setup.count > pool.length) state.setup.count = pool.length;
  if(state.setup.count <= 0 && pool.length) state.setup.count = Math.min(20, pool.length);

  var reviewCount = scoped.filter(function(w){ return (w.wrongCount||0) >= 3; }).length;
  var perfect = scoped.filter(function(w){ return (w.wrongCount||0)===0 && (w.correctCount||0) > 0; }).length;

  var countOpts = [10,20,30,50].filter(function(n){ return n < pool.length; });

  var html = '<div class="statline">'
    + '<b>'+scoped.length+'</b><span>단어</span><span class="dot">·</span>'
    + '<span class="w">'+reviewCount+'</span><span>복습 필요</span><span class="dot">·</span>'
    + '<span class="g">'+perfect+'</span><span>완벽</span>'
    + '</div>'
    + '<div class="wrap setup-outer"><div class="setup">'
    + '<div class="setup-h"><div class="setup-title">오늘 학습</div></div>'
    + '<button class="row" data-sheet="list"><span class="row-k">단어장</span><span class="row-v">'
      + escapeHtml(state.setup.listId ? listName(state.setup.listId) : '전체')
      + ' <small>'+scoped.length+'개</small><i>›</i></span></button>'
    + '<button class="row" data-sheet="dir"><span class="row-k">방향</span><span class="row-v">'+dirLabel(state.setup.dir)+'<i>›</i></span></button>'
    + '<button class="row" data-sheet="scope"><span class="row-k">범위</span><span class="row-v">'+scopeLabel(state.setup.scope)+'<i>›</i></span></button>'
    + (state.setup.scope==='wrongN'
        ? '<button class="row" data-sheet="wrongN"><span class="row-k">틀린 횟수</span><span class="row-v">'
          + ((state.setup.wrongN || state.setup.wrongN===0) ? (state.setup.wrongN===0 ? '0' : state.setup.wrongN)+'번 틀림 <small>'+(wrongNCounts[state.setup.wrongN]||0)+'개</small>' : '없음')
          + '<i>›</i></span></button>'
        : '')
    + '<div class="row static"><span class="row-k">문제 수</span><span class="chips" id="countChips">'
      + countOpts.map(function(n){ return '<button class="chip'+(state.setup.count===n?' on':'')+'" data-n="'+n+'">'+n+'</button>'; }).join('')
      + (pool.length ? '<button class="chip kr'+(state.setup.count===pool.length?' on':'')+'" data-n="'+pool.length+'">전체</button>' : '')
      + '</span></div>'
    + '<div class="start-wrap"><button class="start" id="startBtn"'+(pool.length===0?' disabled':'')+'>'
      + '<div class="n">'+(pool.length ? state.setup.count+'문제' : '학습할 단어 없음')+'</div>'
      + '<div class="t">학습 시작</div></button></div>'
    + '</div>'
    + (pool.length===0 ? '<p class="note">'+(state.setup.scope==='new' ? '이미 전부 한 번 이상 학습했어요. 범위를 바꿔보세요.' : '이 조건에 맞는 단어가 없어요.')+'</p>' : '')
    + '</div>';

  view.innerHTML = html;

  view.querySelectorAll('[data-sheet]').forEach(function(b){
    b.onclick = function(){ openSheet(b.dataset.sheet); };
  });

  if(chips) chips.onclick = function(e){
    var b = e.target.closest('[data-n]'); if(!b) return;
    state.setup.count = parseInt(b.dataset.n,10); render();
  };
  var startBtn = document.getElementById('startBtn');
  if(pool.length) startBtn.onclick = startSession;
}

function startSession(){
  var pool = scopeFilteredWords(state.setup.listId, state.setup.scope).slice();
  pool = pool.map(function(w){ return [Math.random(), w]; }).sort(function(a,b){ return a[0]-b[0]; }).map(function(p){ return p[1]; });
  if(state.setup.scope==='wrong'){
    pool.sort(function(a,b){ return (b.wrongCount||0) - (a.wrongCount||0); });
  }
  pool = pool.slice(0, state.setup.count);
  var queue = pool.map(function(w){
    var dir = state.setup.dir;
    if(dir==='mixed') dir = Math.random()<0.5 ? 'en2ko' : 'ko2en';
    return { id:w.id, word:w.word, pos:w.pos, example:w.example, synAnt:w.synAnt, meaning:w.meaning, dir:dir, hintEx:false, hintSyn:false };
  });
  state.session = { queue: queue, idx: 0, revealed: false, results: [], flip: false };
  render();
}

function currentWordLive(id){ return Store.words.find(function(w){ return w.id===id; }) || {}; }
function wrongTag(id){
  var w = currentWordLive(id);
  var wrong = w.wrongCount||0, right = w.correctCount||0;
  var label = wrong>0 ? wrong+'번 틀림' : (right>0 ? '틀린 적 없음' : '처음 보는 단어');
  return '<span class="tag h'+heatLevel(wrong)+'">'+label+'</span>';
}

function renderSession(){
  var s = state.session;
  if(s.idx >= s.queue.length){ renderSummary(); return; }
  var item = s.queue[s.idx];
  var sa = splitSynAnt(item.synAnt);

  var pct = s.queue.length ? Math.round((s.idx / s.queue.length) * 100) : 0;
  var prevPct = (s.shownPct === undefined) ? pct : s.shownPct;
  var dots = '<i id="gaugeFill" style="width:'+prevPct+'%"></i>';
  s.shownPct = pct;

  var nextItem = s.queue[s.idx+1];

  var html = '<div class="sess-top">'
    + '<button class="quit" id="quitBtn">그만하기</button>'
    + '<div class="dots">'+dots+'</div>'
    + '<div class="count">'+(s.idx+1)+'/'+s.queue.length+'</div>'
    + '</div>'
    + '<div class="stage" id="stageEl">'
    + (s.queue[s.idx+2] ? '<div class="ghost far"><div class="card front">'+frontCardHtml(s.queue[s.idx+2])+'</div></div>' : '')
    + (nextItem ? '<div class="ghost" id="ghostEl"><div class="card front">'+frontCardHtml(nextItem)+'</div></div>' : '')
    + '<div class="swipe'+(s.entering?' enter':'')+'" id="swipeEl"><div class="flip'+(s.flipIn?' pre':'')+'" id="flipEl">'
    + (s.revealed
      ? '<div class="card" id="cardBack">'
        + '<div class="stamp ok" id="stampOk">정답!</div><div class="stamp no" id="stampNo">땡!</div>'
        + '<div class="a-en" data-speak="'+escapeHtml(item.word)+'">'+escapeHtml(item.word)+'</div>'
        + '<div class="a-ko">'+escapeHtml(item.meaning)+'</div>'
        + '<div class="a-chips"><span class="pos '+posCls(item.pos)+'">'+escapeHtml(item.pos||'기타')+'</span>'+wrongTag(item.id)+'</div>'
        + '<div class="hr"></div>'
        + (item.example ? answerExampleHtml(item.example, item.word) : '')
        + (sa.syn ? '<div class="sa syn"><b>동</b><span>'+escapeHtml(sa.syn)+'</span></div>' : '')
        + (sa.ant ? '<div class="sa ant"><b>반</b><span>'+escapeHtml(sa.ant)+'</span></div>' : '')
        + '<div class="tip">밑줄 있는 단어·예문을 탭하면 발음이 나와요</div>'
        + '</div>'
      : '<div class="card front" id="cardFront">'+frontCardHtml(item, true)+'</div>')
    + '</div></div></div>'
    + '<div class="grade"'+(s.revealed?'':' style="visibility:hidden"')+'>'
    + '<button class="gbtn no" id="wrongBtn" title="땡 (←)">✕</button>'
    + '<div class="ghint">← 땡 &nbsp;·&nbsp; 정답 →<br>카드를 밀어도 채점돼요</div>'
    + '<button class="gbtn ok" id="rightBtn" title="정답 (→)">○</button>'
    + '</div>';

  view.innerHTML = html;
  document.getElementById('quitBtn').onclick = function(){ state.session = null; render(); };

  var fill = document.getElementById('gaugeFill');
  if(fill && prevPct !== pct) requestAnimationFrame(function(){ fill.style.width = pct+'%'; });

  var swipeEl = document.getElementById('swipeEl');
  if(s.entering) s.entering = false;
  var flipEl = document.getElementById('flipEl');
  var face = document.getElementById(s.revealed ? 'cardBack' : 'cardFront');
  requestAnimationFrame(function(){
    if(face) face.classList.toggle('scrolly', face.scrollHeight > face.clientHeight + 2);
  });

  if(s.flipIn){
    s.flipIn = false;
    requestAnimationFrame(function(){
      flipEl.classList.add('inAnim');
      requestAnimationFrame(function(){ flipEl.classList.remove('pre'); });
    });
  }

  if(!s.revealed){
    face.onclick = function(){
      if(flipEl.dataset.busy) return;
      flipEl.dataset.busy = '1';
      flipEl.classList.add('half');
      setTimeout(function(){ s.revealed = true; s.flipIn = true; render(); }, 170);
    };
    var hx = document.getElementById('hintExBtn');
    if(hx) hx.onclick = function(e){ e.stopPropagation(); item.hintEx = true; render(); };
    var hs = document.getElementById('hintSynBtn');
    if(hs) hs.onclick = function(e){ e.stopPropagation(); item.hintSyn = true; render(); };
  } else {
    document.getElementById('wrongBtn').onclick = function(){ flingCard(swipeEl, false); };
    document.getElementById('rightBtn').onclick = function(){ flingCard(swipeEl, true); };
    bindSpeakables(view);
    enableSwipe(swipeEl, face);
  }
}

function frontCardHtml(item, interactive){
  var sa = splitSynAnt(item.synAnt);
  var front = item.dir==='en2ko' ? item.word : item.meaning;
  var cls = item.dir==='en2ko' ? 'q-en' : 'q-ko';
  var hintsHtml = '';
  if(interactive && item.hintEx && item.example){
    hintsHtml += '<div class="hint-box"><div class="hl">예문 힌트</div>'+formatExample(String(item.example).split(/\s*\/\s*/).filter(Boolean)[0]||'', item.word, item.dir==='ko2en')+'</div>';
  }
  if(interactive && item.hintSyn && item.synAnt){
    hintsHtml += '<div class="hint-box"><div class="hl">동의어·반의어 힌트</div>'
      + (sa.syn ? '<div>동 · '+escapeHtml(sa.syn)+'</div>' : '')
      + (sa.ant ? '<div>반 · '+escapeHtml(sa.ant)+'</div>' : '') + '</div>';
  }
  var hintBtns = '';
  if(item.example && !(interactive && item.hintEx)) hintBtns += '<button class="hint"'+(interactive?' id="hintExBtn"':'')+'>예문</button>';
  if(item.synAnt && !(interactive && item.hintSyn)) hintBtns += '<button class="hint"'+(interactive?' id="hintSynBtn"':'')+'>동의어</button>';
  return wrongTag(item.id)
    + '<div class="'+cls+'">'+escapeHtml(front)+'</div>'
    + hintsHtml
    + (hintBtns ? '<div class="hints">'+hintBtns+'</div>' : '')
    + '<div class="reveal">탭 → 정답 · 밀어서 채점</div>';
}

function flingCard(card, correct){
  if(!card || card.dataset.flinging) return;
  card.dataset.flinging = '1';
  var ghost = document.getElementById('ghostEl');
  var stamp = document.getElementById(correct ? 'stampOk' : 'stampNo');
  if(stamp) stamp.style.opacity = '1';
  card.style.transition = 'transform .72s cubic-bezier(.36,.62,.4,1), opacity .72s ease';
  card.style.transform = 'translateX('+(correct?660:-660)+'px) rotate('+(correct?16:-16)+'deg)';
  card.style.opacity = '0';
  setTimeout(function(){ gradeCard(correct); }, 330);
}

function enableSwipe(card, scrollFace){
  var x0=null, y0=null, dx=0, dy=0, dragging=false, axis=null;
  var ok = document.getElementById('stampOk'), no = document.getElementById('stampNo');
  function down(e){
    if(card.dataset.flinging) return;
    if(e.target.closest('[data-speak]')) return;
    var t = e.touches ? e.touches[0] : e;
    x0 = t.clientX; y0 = t.clientY; dragging = true; dx = 0; dy = 0; axis = null;
    card.style.transition = 'none';
  }
  function move(e){
    if(!dragging || x0===null) return;
    var t = e.touches ? e.touches[0] : e;
    dx = t.clientX - x0; dy = t.clientY - y0;
    if(axis===null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
      var canScroll = scrollFace && scrollFace.classList.contains('scrolly');
      axis = (Math.abs(dx) > Math.abs(dy) * 1.2 || !canScroll) ? 'x' : 'y';
    }
    if(axis !== 'x') return;
    if(e.cancelable) e.preventDefault();
    card.style.transform = 'translateX('+dx+'px) rotate('+(dx/30)+'deg)';
    if(ok) ok.style.opacity = dx > 20 ? Math.min(1, (dx-20)/70) : 0;
    if(no) no.style.opacity = dx < -20 ? Math.min(1, (-dx-20)/70) : 0;
  }
  function up(){
    if(!dragging) return;
    dragging = false; x0 = null; y0 = null;
    if(axis !== 'x'){ card.style.transform = ''; return; }
    if(Math.abs(dx) > 84){ flingCard(card, dx > 0); return; }
    card.style.transition = 'transform .2s ease, opacity .2s ease';
    card.style.transform = '';
    if(ok) ok.style.opacity = 0;
    if(no) no.style.opacity = 0;
  }
  card.addEventListener('mousedown', down);
  card.addEventListener('touchstart', down, {passive:true});
  window.addEventListener('mousemove', move);
  card.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', up);
  card.addEventListener('touchend', up);
  card.addEventListener('touchcancel', up);
}

document.addEventListener('keydown', function(e){
  var s = state.session;
  if(!s || state.sheet || state.modal || state.listModal || state.csvModal || state.voiceModal || state.exportModal) return;
  if(s.idx >= s.queue.length) return;
  if(!s.revealed){
    if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); s.revealed = true; s.flip = true; render(); }
    return;
  }
  var cardEl = document.getElementById('swipeEl');
  if(e.key==='ArrowRight'){ e.preventDefault(); flingCard(cardEl, true); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); flingCard(cardEl, false); }
});

function gradeCard(correct){
  var s = state.session;
  if(!s || s.idx >= s.queue.length) return;
  var item = s.queue[s.idx];
  var live = currentWordLive(item.id);
  Store.update(item.id, correct ? { correctCount: (live.correctCount||0) + 1 } : { wrongCount: (live.wrongCount||0) + 1 });
  s.results.push({ id:item.id, word:item.word, meaning:item.meaning, correct: correct });
  s.idx += 1;
  s.revealed = false;
  s.entering = true;
  render();
}

function renderSummary(){
  var s = state.session;
  var total = s.results.length;
  var right = s.results.filter(function(r){return r.correct;}).length;
  var missed = s.results.filter(function(r){return !r.correct;});

  var html = '<div class="sum">'
    + '<div class="sum-big"><div class="n">'+right+'</div><div class="d">/ '+total+'</div></div>'
    + '<div class="sum-t">'+(right===total ? '전부 맞혔어요!' : '좋아요, '+right+'개 맞혔어요')+'</div>'
    + '<div class="sum-s">'+(missed.length ? '틀린 '+missed.length+'개는 다음 복습에서 먼저 나와요' : '이 세션에서 틀린 단어가 없어요')+'</div>';

  if(missed.length){
    html += '<div class="miss"><div class="hl">틀린 단어</div>'
      + missed.map(function(r){ return '<div class="miss-row"><b>'+escapeHtml(r.word)+'</b><span>'+escapeHtml(r.meaning)+'</span></div>'; }).join('')
      + '</div>'
      + '<button class="pbtn" id="retryBtn">틀린 '+missed.length+'개 바로 다시</button>';
  }
  html += '<button class="sbtn" id="newBtn">새 학습 시작</button>'
    + '<button class="sbtn" id="toBankBtn">단어장 보기</button></div>';

  view.innerHTML = html;

  if(missed.length){
    document.getElementById('retryBtn').onclick = function(){
      var queue = missed.map(function(r){
        var w = currentWordLive(r.id);
        var dir = state.setup.dir==='mixed' ? (Math.random()<0.5?'en2ko':'ko2en') : state.setup.dir;
        return { id:w.id, word:w.word, pos:w.pos, example:w.example, synAnt:w.synAnt, meaning:w.meaning, dir:dir, hintEx:false, hintSyn:false };
      });
      state.session = { queue: queue, idx:0, revealed:false, results:[], flip:false };
      render();
    };
  }
  document.getElementById('newBtn').onclick = function(){ state.session = null; render(); };
  document.getElementById('toBankBtn').onclick = function(){ state.session = null; switchTab('bank'); };
}

    return 0;
  });
  if(words.length===0){ area.innerHTML = '<p class="note">검색 결과가 없어요.</p>'; return; }

  var showList = !state.bank.listId;

      + '<span class="m">'
        + '<span class="w"><b>'+escapeHtml(w.word)+'</b><span class="pos '+posCls(w.pos)+'">'+escapeHtml(w.pos||'기타')+'</span></span>'

        + (ex ? '<span class="exl" style="display:block">'+escapeHtml(ex)+'</span>' : '')
      + '</span>'
      + '<span class="wnum"><span class="heat heat-'+heatLevel(w.wrongCount)+'">'+(w.wrongCount||0)+'</span></span>'

  html += '<table class="wtable"><thead><tr>'
    + th('단어','word') + '<th>품사</th>' + th('한글 뜻','word') + '<th>예문</th><th>동의어 · 반의어</th>'
    + (showList ? '<th>단어장</th>' : '')

          + (showList ? '<td class="lst">'+escapeHtml(listName(w.listId))+'</td>' : '')
          + '<td class="c"><span class="heat heat-'+heatLevel(w.wrongCount)+'">'+(w.wrongCount||0)+'</span></td>'
          + '</tr>';

      else { state.bank.sortKey = k; state.bank.sortDir = (k==='word')?'asc':'desc'; }
      renderBankResults();
    };
  });
}
function th(label, key, num){
  return '<th class="sortable'+(num?' c':'')+'" data-key="'+key+'">'+label
    + (state.bank.sortKey===key ? (state.bank.sortDir==='asc'?' ↑':' ↓') : '') + '</th>';

  if(!Store.words.find(function(x){return x.id===id;})) return;

}
function startEdit(id){

    mode:'edit', id:id, word:w.word, pos:w.pos||'명사', meaning:w.meaning, example:w.example||'',

    wrongCount: w.wrongCount||0, correctCount: w.correctCount||0, fromView:true

function closeModal(){ state.modal = null; state.deleteArmed = null; render(); }

    + '<div class="field"><label>한글 뜻 *</label><input type="text" id="fMeaning" value="'+escapeHtml(m.meaning)+'" placeholder="예: 속임수"></div>'

      + POS.map(function(p){ return '<button data-v="'+p.v+'" class="'+(m.pos===p.v?'on '+p.cls:'')+'">'+p.v+'</button>'; }).join('')
      + '</div></div>'

      + '<textarea id="fExample" placeholder="The building was virtually destroyed…">'+escapeHtml(m.example)+'</textarea></div>'
    + '<div class="field"><label>동의어 · 반의어</label>'
      + '<div class="sa-field syn"><b>동</b><input type="text" id="fSyn" value="'+escapeHtml(m.syn)+'" placeholder="almost, nearly"></div>'
      + '<div class="sa-field ant"><b>반</b><input type="text" id="fAnt" value="'+escapeHtml(m.ant)+'" placeholder="반의어 (선택)"></div></div>'
    + '<div class="field"><label>단어장 *</label><select id="fList">'
      + Store.lists.map(function(l){ return '<option value="'+l.id+'"'+(m.listId===l.id?' selected':'')+'>'+escapeHtml(l.name)+'</option>'; }).join('')
      + '</select></div>';

  if(isEdit){
    html += '<div class="danger" id="dangerZone">';
    if(state.deleteArmed===m.id){
      html += '<div class="confirm">정말 삭제할까요? <button class="yes" id="confirmDelBtn">삭제</button><button class="no" id="cancelDelBtn">취소</button></div>';
    } else {

    }

  document.getElementById('cancelBtn').onclick = function(){ if(m.fromView){ state.modal={mode:'view',id:m.id,shown:true}; state.deleteArmed=null; render(); } else closeModal(); };
  document.getElementById('fWord').oninput = function(e){ m.word = e.target.value; };
  document.getElementById('fMeaning').oninput = function(e){ m.meaning = e.target.value; };
  document.getElementById('fExample').oninput = function(e){ m.example = e.target.value; };
  document.getElementById('fSyn').oninput = function(e){ m.syn = e.target.value; };
  document.getElementById('fAnt').oninput = function(e){ m.ant = e.target.value; };
  document.getElementById('fList').onchange = function(e){ m.listId = e.target.value; };
  document.getElementById('posPick').onclick = function(e){

function renderViewModal(root, m){
  var w = Store.words.find(function(x){return x.id===m.id;});
  if(!w){ state.modal=null; root.innerHTML=''; return; }
  var sa = splitSynAnt(w.synAnt);
  var spk = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var enter = !m.shown; m.shown = true;
  var html = '<div class="back vw'+(enter?' enter':'')+'" id="modalBack"><div class="sheet vw-sheet'+(enter?' enter':'')+'" id="vwSheet"><div class="grab"></div>'
    + '<div class="sheet-t"><span></span><button class="cancel" id="vwClose">닫기</button></div>'
    + '<div class="vw-top"><div class="a-en" data-speak="'+escapeHtml(w.word)+'">'+escapeHtml(w.word)+'</div>'
    + '<button class="vw-spk" data-speak="'+escapeHtml(w.word)+'" aria-label="발음 듣기">'+spk+'</button></div>'
    + '<div class="a-ko">'+escapeHtml(w.meaning)+'</div>'
    + '<div class="a-chips"><span class="pos '+posCls(w.pos)+'">'+escapeHtml(w.pos||'기타')+'</span></div>'
    + ((w.example||sa.syn||sa.ant) ? '<div class="hr"></div>' : '')
    + (w.example ? answerExampleHtml(w.example, w.word) : '')
    + (sa.syn ? '<div class="sa syn"><b>동</b><span>'+escapeHtml(sa.syn)+'</span></div>' : '')
    + (sa.ant ? '<div class="sa ant"><b>반</b><span>'+escapeHtml(sa.ant)+'</span></div>' : '')
    + '<div class="vw-meta"><span>틀림 <b>'+(w.wrongCount||0)+'</b></span><span>정답 <b>'+(w.correctCount||0)+'</b></span><span>'+escapeHtml(listName(w.listId))+'</span></div>'
    + '<div class="vw-acts">'
    + (state.deleteArmed===w.id
        ? '<div class="confirm">정말 삭제할까요? <button class="yes" id="vwDelYes">삭제</button><button class="no" id="vwDelNo">취소</button></div>'
        : '<button class="delbtn" id="vwDel">삭제</button><button class="pbtn" id="vwEdit">수정</button>')
    + '</div></div></div>';
  root.innerHTML = html;
  bindSpeakables(root);
  var back = document.getElementById('modalBack'), sheet = document.getElementById('vwSheet');
  function dismiss(){
    if(sheet.dataset.closing) return; sheet.dataset.closing = '1';
    sheet.classList.remove('enter'); back.classList.remove('enter');
    sheet.style.transition = 'transform .26s cubic-bezier(.4,0,.8,.6)';
    sheet.style.transform = 'translateY('+(sheet.offsetHeight+20)+'px)';
    back.style.backgroundColor = 'transparent';
    setTimeout(closeModal, 260);
  }
  back.onclick = function(e){ if(e.target.id==='modalBack') dismiss(); };
  document.getElementById('vwClose').onclick = dismiss;
  (function(){
    var y0=0, t0=0, dy=0, drag=false, track=false;
    sheet.addEventListener('touchstart', function(e){
      if(sheet.dataset.closing) return;
      y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0; drag = false;
      track = sheet.scrollTop <= 0;
    }, {passive:true});
    sheet.addEventListener('touchmove', function(e){
      if(!track) return;
      var d = e.touches[0].clientY - y0;
      if(!drag){ if(d > 6){ drag = true; sheet.classList.remove('enter'); sheet.style.transition='none'; } else if(d < -6){ track=false; return; } else return; }
      if(e.cancelable) e.preventDefault();
      dy = Math.max(0, d);
      sheet.style.transform = 'translateY('+dy+'px)';
      back.classList.remove('enter');
      back.style.transition = 'none';
      back.style.opacity = String(Math.max(0.2, 1 - dy/(sheet.offsetHeight*1.1)));
    }, {passive:false});
    function end(){
      if(!drag){ track=false; return; }
      drag = false; track = false;
      var v = dy / Math.max(1, Date.now()-t0);
      back.style.transition = 'opacity .26s ease'; back.style.opacity = '';
      if(dy > sheet.offsetHeight*0.28 || v > 0.6){ dismiss(); }
      else { sheet.style.transition = 'transform .3s cubic-bezier(.22,.9,.3,1)'; sheet.style.transform = 'translateY(0)'; }
    }
    sheet.addEventListener('touchend', end);
    sheet.addEventListener('touchcancel', end);
  })();
  if(state.deleteArmed===w.id){
    document.getElementById('vwDelYes').onclick = function(){ Store.remove(w.id); closeModal(); };
    document.getElementById('vwDelNo').onclick = function(){ state.deleteArmed=null; render(); };
  } else {
    document.getElementById('vwDel').onclick = function(){ state.deleteArmed = w.id; render(); };
    document.getElementById('vwEdit').onclick = function(){ startEdit(w.id); };
  }
}

      } else {
        html += '<button class="ibtn" data-act="askDelete" title="삭제" style="color:var(--danger)">✕</button>';

  });

    + '<button id="addListBtn">추가</button></div>';
  if(Store.lists.length>0) html += '<div class="sheet-acts"><button class="pbtn" id="exportAllBtn">⇪ 전체 내보내기</button></div>';
  html += '</div></div>';

  document.getElementById('addListBtn').onclick = function(){
    var name = document.getElementById('newListInput').value.trim();

  if(editInput) editInput.oninput = function(e){ m.editingName = e.target.value; };

  root.querySelectorAll('.lrow').forEach(function(row){
    var id = row.dataset.id;
    var act = function(sel, fn){ var el = row.querySelector(sel); if(el) el.onclick = fn; };
    act('[data-act="rename"]', function(){
      var l = Store.lists.find(function(x){return x.id===id;});
      m.editingId = id; m.editingName = l ? l.name : ''; render();
    });
    act('[data-act="saveRename"]', function(){
      var name = document.getElementById('editListInput').value.trim();
      if(name) Store.renameList(id, name);
      m.editingId = null; render();
    });
    act('[data-act="cancelRename"]', function(){ m.editingId = null; render(); });
    act('[data-act="export"]', function(){ openExportModal(id); });
    act('[data-act="askDelete"]', function(){ state.listDeleteArmed = id; render(); });
    act('[data-act="cancelDelete"]', function(){ state.listDeleteArmed = null; render(); });
    act('[data-act="confirmDelete"]', function(){
      var cnt = wordsInList(id).length;
      Store.deleteList(id, cnt>0);
      state.listDeleteArmed = null;
      if(state.bank.listId===id) state.bank.listId = null;
      if(state.setup.listId===id) state.setup.listId = null;
      render();
    });
  });
}

    + '<div class="hintbox" style="margin-top:8px">첫 줄은 헤더로 인식돼요 (단어/word, 품사/pos, 한글뜻/meaning, 예문/example, 동의어·반의어, 단어장). 동의어·반의어 칸에 ↔ 또는 opp: 가 있으면 반의어로 자동 분리돼요.</div>'

    + '<button class="pbtn" id="csvImportGo">가져오기</button>'

function refreshCsvPreview(){
  var m = state.csvModal;
  var area = document.getElementById('csvPreviewArea');
  var goBtn = document.getElementById('csvImportGo');
  if(!m || !area || !goBtn) return;
  var res = csvRowsToWords(parseCsv(m.text));
  var html = '';
  if(res.items.length){
    html += '<div class="csvprev"><table><thead><tr><th>단어</th><th>품사</th><th>한글뜻</th><th>예문</th><th>동·반</th>'
      + (res.hasListCol ? '<th>단어장</th>' : '') + '</tr></thead><tbody>'
      + res.items.slice(0,5).map(function(it){
          return '<tr><td>'+escapeHtml(it.word)+'</td><td>'+escapeHtml(it.pos)+'</td><td>'+escapeHtml(it.meaning)+'</td>'
            + '<td>'+escapeHtml(it.example)+'</td><td>'+escapeHtml(it.synAnt)+'</td>'
            + (res.hasListCol ? '<td>'+escapeHtml(it.listName||'—')+'</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>';
    html += '<div class="csvsum">가져올 단어 <b>'+res.items.length+'</b>개'
      + (res.skipped ? ' · <span class="sk">'+res.skipped+'개 건너뜀</span>' : '')
      + (res.items.length>5 ? ' · 위 5개만 미리보기' : '') + '</div>';
  }
  area.innerHTML = html;
  var canImport = res.items.length>0 && !(m.listId==='__new__' && !m.newListName.trim()) && !m.importing;
  goBtn.disabled = !canImport;
  goBtn.textContent = m.importing ? '가져오는 중… ('+m.progress+'/'+m.total+')' : '가져오기';
}

async function resolveListByName(cache, name){
  var key = name.trim().toLowerCase();
  if(cache[key]) return cache[key];
  var existing = Store.lists.find(function(l){ return l.name.trim().toLowerCase()===key; });
  if(existing){ cache[key] = existing.id; return existing.id; }
  var created = await Store.addListAsync(name.trim());
  cache[key] = created.id;
  return created.id;
}
async function runCsvImport(){
  var m = state.csvModal;
  if(!m || m.importing) return;
  var res = csvRowsToWords(parseCsv(m.text));
  if(!res.items.length) return;
  m.importing = true; m.progress = 0; m.total = res.items.length; render();

  var listCache = {}, fallbackListId = null;
  async function getFallbackListId(){
    if(fallbackListId) return fallbackListId;
    if(m.listId === '__new__'){
      var created = await Store.addListAsync(m.newListName.trim() || '새 단어장');
      fallbackListId = created.id;
    } else { fallbackListId = m.listId; }
    return fallbackListId;
  }
  var lastListId = null;
  for(var i=0;i<res.items.length;i++){
    var it = res.items[i];
    var targetId = it.listName ? await resolveListByName(listCache, it.listName) : await getFallbackListId();
    lastListId = targetId;
    await Store.addAsync({word:it.word, pos:it.pos, meaning:it.meaning, example:it.example, synAnt:it.synAnt, listId:targetId});
    m.progress = i+1; render();
  }
  state.bank.listId = res.hasListCol ? null : lastListId;
  m.importing = false;
  m.done = { added: res.items.length, skipped: res.skipped };
  render();
}

function copyText(text, statusEl){
  var done = function(ok){
    if(!statusEl) return;
    statusEl.textContent = ok ? '✓ 복사됐어요' : '복사 실패 — 위 텍스트를 직접 선택해 복사해주세요';
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ done(false); });
  } else { done(false); }
}

/* ---------------- auth ---------------- */
var authState = { session:null, mode:'signin', email:'', pw:'', pw2:'', showPw:false, busy:false, msg:null, msgKind:'no',
  stage:'form', code:'', codeKind:'email', codeEmail:'' };

function renderApp(){
  var appWrap = document.getElementById('appWrap');
  if(authState.session){
    appWrap.hidden = false;
    document.getElementById('authScreen').innerHTML = '';
    render();
  } else {
    appWrap.hidden = true;
    renderLogin();
  }
}

function renderLogin(){
  var root = document.getElementById('authScreen');
  var a = authState;

  if(!configOk){
    root.innerHTML = '<div class="auth"><div class="auth-logo">Repeat<span>.</span></div>'
      + '<p class="auth-sub">아직 설정이 끝나지 않았어요.</p>'
      + '<div class="auth-msg no">config.js 파일에 Supabase Project URL과 anon public key를 채워 넣어야 로그인할 수 있어요. README.md의 설정 방법을 참고해주세요.</div></div>';
    return;
  }

  if(a.stage==='code'){ renderCodeStep(); return; }

  var isUp = a.mode==='signup';
  root.innerHTML = '<div class="auth">'
    + '<div class="auth-logo">Repeat<span>.</span></div>'
    + (isUp ? '<p class="auth-sub">이메일과 비밀번호만 있으면 됩니다.</p>' : '')
    + '<div class="auth-tabs"><button data-m="signin" class="'+(!isUp?'on':'')+'">로그인</button>'
      + '<button data-m="signup" class="'+(isUp?'on':'')+'">회원가입</button></div>'
    + '<div style="margin-top:18px">'
    + '<div class="field"><label>이메일</label><input type="email" id="aEmail" autocomplete="email" placeholder="you@email.com" value="'+escapeHtml(a.email)+'"></div>'
    + '<div class="field"><label>비밀번호'+(isUp?' <span style="color:var(--faint)">6자 이상</span>':'')+'</label>'
      + '<div class="pw-wrap"><input type="'+(a.showPw?'text':'password')+'" id="aPw" autocomplete="'+(isUp?'new-password':'current-password')+'" placeholder="••••••••" value="'+escapeHtml(a.pw)+'">'
      + '<button id="aPwToggle">'+(a.showPw?'숨기기':'보기')+'</button></div></div>'
    + (isUp ? '<div class="field"><label>비밀번호 다시 입력</label><input type="'+(a.showPw?'text':'password')+'" id="aPw2" autocomplete="new-password" placeholder="••••••••" value="'+escapeHtml(a.pw2)+'">'
        + (a.pw2 ? '<div style="font-size:11.5px;margin-top:5px;color:'+(a.pw===a.pw2?'var(--mint)':'var(--danger)')+'">'+(a.pw===a.pw2?'일치 ✓':'비밀번호가 달라요')+'</div>' : '')
        + '</div>' : '')
    + '</div>'
    + '<div class="keep"><label id="keepLabel"><span class="box'+(keepSignedIn()?' on':'')+'">'+(keepSignedIn()?'✓':'')+'</span>로그인 상태 유지</label>'
      + (isUp ? '' : '<button class="linkbtn" id="aReset">비밀번호 찾기</button>') + '</div>'
    + '<button class="pbtn" id="aGo"'+(a.busy?' disabled':'')+'>'+(a.busy?'처리 중…':(isUp?'가입하고 시작하기':'로그인'))+'</button>'
    + '<div class="or"><div></div><span>또는</span><div></div></div>'
    + '<button class="sbtn" style="margin:0" id="aLink">인증번호로 로그인</button>'
    + (a.msg ? '<div class="auth-msg '+a.msgKind+'">'+escapeHtml(a.msg)+'</div>' : '')
    + '<p class="auth-note">"로그인 상태 유지"를 켜두면 브라우저를 닫아도 로그인이 유지돼요. 같은 계정으로 로그인하면 컴퓨터·휴대폰이 실시간으로 함께 동기화됩니다.</p>'
    + '</div>';

  root.querySelectorAll('.auth-tabs button').forEach(function(b){
    b.onclick = function(){ a.mode = b.dataset.m; a.msg = null; renderLogin(); };
  });
  var emailEl = document.getElementById('aEmail'), pwEl = document.getElementById('aPw'), pw2El = document.getElementById('aPw2');
  emailEl.oninput = function(e){ a.email = e.target.value; };
  pwEl.oninput = function(e){ a.pw = e.target.value; };
  if(pw2El) pw2El.oninput = function(e){ a.pw2 = e.target.value; renderLogin(); document.getElementById('aPw2').focus(); };
  document.getElementById('aPwToggle').onclick = function(){ a.showPw = !a.showPw; renderLogin(); };
  document.getElementById('keepLabel').onclick = function(){
    setKeepSignedIn(!keepSignedIn());
    sb = buildClient();
    renderLogin();
  };
  document.getElementById('aGo').onclick = submitAuth;
  document.getElementById('aLink').onclick = sendLoginCode;
  var resetBtn = document.getElementById('aReset');
  if(resetBtn) resetBtn.onclick = resetPassword;
  [emailEl, pwEl, pw2El].forEach(function(el){
    if(el) el.onkeydown = function(e){ if(e.key==='Enter') submitAuth(); };
  });
}

function redirectUrl(){ return window.location.origin + window.location.pathname; }

/* ---- 인증번호(6자리) 입력 단계 ---- */
function renderCodeStep(){
  var a = authState;
  var root = document.getElementById('authScreen');
  root.innerHTML = '<div class="auth">'
    + '<div class="auth-logo">Repeat<span>.</span></div>'
    + '<p class="auth-sub"><b style="color:var(--ink-2)">'+escapeHtml(a.codeEmail)+'</b> 로 6자리 인증번호를 보냈어요.<br>메일에 적힌 숫자를 입력해주세요.</p>'
    + '<div class="field" style="margin-top:22px"><label>인증번호</label>'
      + '<input type="text" id="aCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="______" value="'+escapeHtml(a.code)+'" '
      + 'style="font-family:var(--f-mono);font-size:22px;letter-spacing:.28em;text-align:center"></div>'
    + '<button class="pbtn" id="aVerify"'+(a.busy?' disabled':'')+'>'+(a.busy?'확인 중…':'확인하고 시작하기')+'</button>'
    + '<button class="sbtn" id="aResend">인증번호 다시 받기</button>'
    + '<button class="sbtn" id="aBack">다른 이메일로 하기</button>'
    + (a.msg ? '<div class="auth-msg '+a.msgKind+'">'+escapeHtml(a.msg)+'</div>' : '')
    + '<p class="auth-note">메일이 안 보이면 스팸함도 확인해주세요. 인증번호는 약 1시간 동안 유효해요.</p>'
    + '</div>';

  var codeEl = document.getElementById('aCode');
  codeEl.oninput = function(e){ a.code = e.target.value.replace(/[^0-9]/g,''); e.target.value = a.code; };
  codeEl.onkeydown = function(e){ if(e.key==='Enter') verifyCode(); };
  codeEl.focus();
  document.getElementById('aVerify').onclick = verifyCode;
  document.getElementById('aResend').onclick = function(){
    if(a.codeKind==='signup') resendSignupCode(); else sendLoginCode();
  };
  document.getElementById('aBack').onclick = function(){
    a.stage = 'form'; a.code = ''; a.msg = null; renderLogin();
  };
}

async function verifyCode(){
  var a = authState;
  if(a.busy) return;
  if(!a.code || a.code.length < 6){ a.msg = '메일에 적힌 6자리 숫자를 입력해주세요.'; a.msgKind='no'; return renderCodeStep(); }
  a.busy = true; a.msg = null; renderCodeStep();
  var res = await sb.auth.verifyOtp({ email: a.codeEmail, token: a.code, type: a.codeKind==='signup' ? 'signup' : 'email' });
  a.busy = false;
  if(res.error){
    a.msg = translateAuthError(res.error.message);
    a.msgKind = 'no';
    renderCodeStep();
  } else {
    a.stage = 'form'; a.code = ''; a.pw = ''; a.pw2 = ''; a.msg = null;
  }
}

async function sendLoginCode(){
  var a = authState;
  var email = (a.email||'').trim() || a.codeEmail;
  if(!email){ a.msg = '이메일을 입력하면 인증번호를 보내드려요.'; a.msgKind='no'; return renderLogin(); }
  a.busy = true; a.msg = null;
  if(a.stage==='code') renderCodeStep(); else renderLogin();
  var res = await sb.auth.signInWithOtp({ email: email, options:{ shouldCreateUser: true } });
  a.busy = false;
  if(res.error){
    a.msg = translateAuthError(res.error.message); a.msgKind = 'no';
    if(a.stage==='code') renderCodeStep(); else renderLogin();
    return;
  }
  a.codeEmail = email; a.codeKind = 'email'; a.stage = 'code'; a.code = '';
  a.msg = '인증번호를 보냈어요.'; a.msgKind = 'ok';
  renderCodeStep();
}

async function resendSignupCode(){
  var a = authState;
  a.busy = true; a.msg = null; renderCodeStep();
  var res = await sb.auth.resend({ type:'signup', email: a.codeEmail });
  a.busy = false;
  a.msg = res.error ? translateAuthError(res.error.message) : '인증번호를 다시 보냈어요.';
  a.msgKind = res.error ? 'no' : 'ok';
  renderCodeStep();
}

async function submitAuth(){
  var a = authState;
  if(a.busy) return;
  var email = (a.email||'').trim();
  if(!email || !a.pw){ a.msg = '이메일과 비밀번호를 입력해주세요.'; a.msgKind='no'; return renderLogin(); }
  if(a.mode==='signup'){
    if(a.pw.length < 6){ a.msg = '비밀번호는 6자 이상으로 해주세요.'; a.msgKind='no'; return renderLogin(); }
    if(a.pw !== a.pw2){ a.msg = '비밀번호 확인이 일치하지 않아요.'; a.msgKind='no'; return renderLogin(); }
  }
  a.busy = true; a.msg = null; renderLogin();

  var res;
  if(a.mode==='signup'){
    res = await sb.auth.signUp({ email: email, password: a.pw });
  } else {
    res = await sb.auth.signInWithPassword({ email: email, password: a.pw });
  }
  a.busy = false;
  if(res.error){
    a.msg = translateAuthError(res.error.message);
    a.msgKind = 'no';
  } else if(a.mode==='signup' && !res.data.session){
    a.codeEmail = email; a.codeKind = 'signup'; a.stage = 'code'; a.code = '';
    a.msg = null;
    return renderCodeStep();
  } else {
    a.pw = ''; a.pw2 = '';
  }
  renderLogin();
}

function translateAuthError(msg){
  var m = String(msg||'');
  if(/invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';
  if(/already registered|already exists/i.test(m)) return '이미 가입된 이메일이에요. 로그인 탭에서 비밀번호로 들어와 주세요.';
  if(/email not confirmed/i.test(m)) return '메일로 받은 인증번호 확인이 아직 안 됐어요. 인증번호로 로그인을 눌러주세요.';
  if(/token has expired|expired or invalid|invalid token/i.test(m)) return '인증번호가 만료됐거나 틀렸어요. 다시 받아주세요.';
  if(/password should be at least/i.test(m)) return '비밀번호는 6자 이상으로 해주세요.';
  return m;
}

async function resetPassword(){
  var a = authState;
  var email = (a.email||'').trim();
  if(!email){ a.msg = '비밀번호를 재설정할 이메일을 입력해주세요.'; a.msgKind='no'; return renderLogin(); }
  a.busy = true; renderLogin();
  var res = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
  a.busy = false;
  a.msg = res.error ? translateAuthError(res.error.message) : (email + ' 로 비밀번호 재설정 메일을 보냈어요.');
  a.msgKind = res.error ? 'no' : 'ok';
  renderLogin();
}

async function initAuth(){
  if(!configOk || !sb){ renderApp(); return; }
  var got = await sb.auth.getSession();
  authState.session = got.data.session;
  renderApp();
  if(authState.session) Store.initForUser(authState.session.user.id);

  sb.auth.onAuthStateChange(function(event, session){
    authState.session = session;
    if((event==='SIGNED_IN' || event==='TOKEN_REFRESHED') && session && Store.userId !== session.user.id){
      Store.initForUser(session.user.id);
    }
    if(event==='SIGNED_OUT'){ Store.teardown(); }
    renderApp();
  });
}

document.getElementById('tabStudy').onclick = function(){ switchTab('study'); };
document.getElementById('tabBank').onclick = function(){ switchTab('bank'); };
Store.onChange(render);
initAuth();

})();
